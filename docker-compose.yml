services:
  ghoststack:
    image: ghcr.io/lukius/ghoststack:latest
    container_name: ghoststack
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ghoststack-data:/app/data
    # Optional: override defaults
    # environment:
    #   GHOSTSTACK_LOG_LEVEL: info

volumes:
  ghoststack-data:
